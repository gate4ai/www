# Сайт gate4.ai на сервере relay: отдельный Compose-проект в /opt/gate4ai-www.
# Сеть хоста, как у стека наблюдаемости: сайт слушает только 127.0.0.1:8080,
# снаружи до него доходят через relay (--route gate4.ai, www.gate4.ai → Caddy
# 127.0.0.1:8444, TLS) → reverse_proxy сюда. Тег образа — WWW_TAG в .env
# (его пишет deploy.sh из CI); секрет webhook — в www.env (не в репозитории).
name: gate4ai-www

services:
  www:
    image: ghcr.io/gate4ai/www:${WWW_TAG:?set WWW_TAG in .env}
    network_mode: host
    restart: unless-stopped
    logging:
      driver: journald
    environment:
      GATE4AI_WWW_LISTEN: 127.0.0.1:8080
      GATE4AI_WWW_CANONICAL_HOST: gate4.ai
    env_file:
      - path: ./www.env
        required: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${WWW_MEM:-64m}
