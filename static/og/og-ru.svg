<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 120) scale(620 420)">
      <stop offset="0" stop-color="#5ee6a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ee6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#090b0e"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(80 72)">
    <rect x="3" y="3" width="50" height="50" rx="15" fill="none" stroke="#eef1f5" stroke-width="4.5"/>
    <path d="M19 15v26M37 15v26" stroke="#eef1f5" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="5" fill="#5ee6a8"/>
    <text x="74" y="41" font-size="36" font-weight="700" fill="#eef1f5" letter-spacing="-0.5">gate4<tspan fill="#5ee6a8">.ai</tspan></text>
  </g>
  <text x="1120" y="113" text-anchor="end" font-family="'JetBrains Mono', 'Noto Sans Mono', ui-monospace, monospace" font-size="20" fill="#9ba5b4" letter-spacing="1.5">ОТКРЫТЫЙ КОД · НА ВАШЕМ КОМПЬЮТЕРЕ</text>

  <!-- headline -->
  <text x="80" y="280" font-size="68" font-weight="800" fill="#eef1f5" letter-spacing="-2">AI-агенты получают</text>
  <text x="80" y="366" font-size="68" font-weight="800" fill="#eef1f5" letter-spacing="-2"><tspan fill="#5ee6a8">только</tspan> то, что вы разрешили.</text>
  <text x="80" y="432" font-size="27" fill="#9ba5b4">Claude, ChatGPT, Claude Code, OpenClaw и Hermes получают доступ к браузеру</text>
  <text x="80" y="470" font-size="27" fill="#9ba5b4">и файлам только по вашим правилам. Паролей агенты не видят.</text>

  <!-- pills -->
  <g font-family="'JetBrains Mono', 'Noto Sans Mono', ui-monospace, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="80" y="528" width="176" height="46" rx="23" fill="rgba(94,230,168,0.14)"/>
    <text x="168" y="559" fill="#5ee6a8">разрешить</text>
    <rect x="272" y="528" width="164" height="46" rx="23" fill="rgba(247,193,92,0.14)"/>
    <text x="354" y="559" fill="#f7c15c">спросить</text>
    <rect x="452" y="528" width="176" height="46" rx="23" fill="rgba(255,122,110,0.14)"/>
    <text x="540" y="559" fill="#ff7a6e">запретить</text>
  </g>
  <text x="1120" y="559" text-anchor="end" font-size="22" fill="#9ba5b4">macOS · Linux · Windows</text>
</svg>
